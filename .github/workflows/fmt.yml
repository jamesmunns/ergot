name: Formatting

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: "rustfmt - all workspaces"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      # Mirror fmtall.sh in --check mode. Keep this list in sync with that script.
      - name: Check formatting
        run: |
          cargo fmt --manifest-path=./crates/ergot/Cargo.toml -- --check
          cargo fmt --manifest-path=./crates/cobs-acc/Cargo.toml -- --check
          cargo fmt --manifest-path=./demos/shared-icd/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/std/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/microbit/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/nrf52840/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/rp2040/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/rp2350/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/esp32c6/Cargo.toml -- --check
          cargo fmt --all --manifest-path=./demos/stm32f303vc/Cargo.toml -- --check
