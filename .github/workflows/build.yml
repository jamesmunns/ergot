name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: "Build all crates"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-toolchain:
          # Pinned for reproducible CI; bump deliberately.
          - nightly-2026-07-30
          - stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          # thumbv6m/riscv32imc have no atomic CAS (rp2040, esp32c3)
          targets: thumbv7em-none-eabi, thumbv6m-none-eabi, riscv32imc-unknown-none-elf
      #
      # COBS ACC
      #
      # no features, on std
      - name: Check cobs-acc (no features, on host)
        working-directory: ./crates/cobs-acc
        run: cargo build --locked
      # std features, on std
      - name: Check cobs-acc (std features, on host)
        working-directory: ./crates/cobs-acc
        run: cargo build --features=std --locked
      # no features, on mcu
      - name: Check cobs-acc (no features, on mcu)
        working-directory: ./crates/cobs-acc
        run: cargo build --target=thumbv7em-none-eabi --locked
      # std features, on std, test
      - name: Test cobs-acc (std features, on host)
        working-directory: ./crates/cobs-acc
        run: cargo test --features=std --locked
      #
      # ERGOT Prime
      #
      # no features, on std
      - name: Check ergot (no features, on host)
        working-directory: ./crates/ergot
        run: cargo build --locked
      # std features, on std
      - name: Check ergot (std features, on host)
        working-directory: ./crates/ergot
        run: cargo build --features=tokio-std --locked
      # no features, on mcu
      - name: Check ergot (no features, on mcu)
        working-directory: ./crates/ergot
        run: cargo build --target=thumbv7em-none-eabi --locked
      # mcus without atomic CAS: the application picks portable-atomic's
      # fallback (critical-section or single-core); single-core stands in here
      - name: Check ergot (defmt sinks, on mcus without CAS)
        working-directory: ./crates/ergot
        env:
          RUSTFLAGS: -D warnings --cfg portable_atomic_unsafe_assume_single_core
        run: |
          for target in thumbv6m-none-eabi riscv32imc-unknown-none-elf; do
            cargo build --target=$target --locked
            for features in defmt-sink-network defmt-sink-rtt defmt-sink-network,defmt-sink-rtt; do
              cargo build --target=$target --features=$features --locked
            done
          done
      # std features, on std
      - name: Test ergot (std features, on host)
        working-directory: ./crates/ergot
        run: cargo test --features=tokio-std --locked
      # doctests across all features (feature-gated doctests are otherwise
      # never compiled: `cargo doc` does not build them and the test step
      # above only enables tokio-std)
      - name: Doctests ergot (all features)
        working-directory: ./crates/ergot
        run: cargo test --doc --all-features --locked
